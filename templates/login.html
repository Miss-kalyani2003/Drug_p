<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Drug Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f5f5;

            /* Background image */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
                url("{{ url_for('static', filename='images/bg.jpg') }}")
                no-repeat center center fixed;
            background-size: cover;
        }
        .card {
            width: 360px;
            padding: 28px 26px 30px;
            border-radius: 14px;
            background: rgba(15, 15, 15, 0.78);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
        }
        .card h2 {
            margin: 0 0 4px;
            font-weight: 600;
        }
        .subtitle {
            margin-bottom: 18px;
            font-size: 13px;
            opacity: 0.8;
        }
        label {
            display: block;
            margin: 10px 0 4px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 9px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #f5f5f5;
            outline: none;
        }
        input:focus {
            border-color: #4dabf7;
            background: rgba(255,255,255,0.10);
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #4dabf7, #228be6);
            color: white;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        button:hover {
            opacity: 0.95;
        }
        .links {
            margin-top: 14px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        .links a {
            color: #74c0fc;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        #msg {
            margin-top: 10px;
            font-size: 13px;
            color: #ffd43b;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Welcome back</h2>
    <div class="subtitle">Login to access the Drug Prediction system</div>

    <form id="loginForm">
        <label>Email</label>
        <input type="email" name="email_id" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <button type="submit">Login</button>
    </form>

    <div id="msg"></div>

    <div class="links">
        <span>New user? <a href="/register_page">Create account</a></span>
        <span><a href="/prediction_page">Go to prediction</a></span>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    let formData = new FormData(this);

    const res = await fetch("/login", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    document.getElementById("msg").innerText = data.message || "Something went wrong";

    if (data.status === "success" && data.token) {
        localStorage.setItem("jwtToken", data.token);
        // Redirect to prediction page
        window.location.href = "/prediction_page";
    }
});
</script>

</body>
</html>
