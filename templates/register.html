<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Drug Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f5f5;
            background:
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75)),
                url("{{ url_for('static', filename='images/bg.jpg') }}")
                no-repeat center center fixed;
            background-size: cover;
        }
        .card {
            width: 380px;
            padding: 26px 26px 30px;
            border-radius: 14px;
            background: rgba(15, 15, 15, 0.78);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
        }
        .card h2 {
            margin: 0 0 4px;
            font-weight: 600;
        }
        .subtitle {
            margin-bottom: 16px;
            font-size: 13px;
            opacity: 0.8;
        }
        label {
            display: block;
            margin: 8px 0 4px;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #f5f5f5;
            outline: none;
        }
        input:focus {
            border-color: #51cf66;
            background: rgba(255,255,255,0.10);
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #51cf66, #37b24d);
            color: white;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.96;
        }
        #msg {
            margin-top: 10px;
            font-size: 13px;
            color: #ffd43b;
            min-height: 18px;
        }
        .links {
            margin-top: 12px;
            font-size: 13px;
        }
        .links a {
            color: #74c0fc;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Create account</h2>
    <div class="subtitle">Register to start using the Drug Prediction app</div>

    <form id="regForm">
        <label>User name</label>
        <input type="text" name="user_name" placeholder="Your full name" required>

        <label>Email ID</label>
        <input type="email" name="email_id" placeholder="you@example.com" required>

        <label>Contact number</label>
        <input type="text" name="contact_num" placeholder="9999999999" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a strong password" required>

        <button type="submit">Register</button>
    </form>

    <div id="msg"></div>

    <div class="links">
        Already have an account?
        <a href="/login_page">Login here</a>
    </div>
</div>

<script>
document.getElementById("regForm").addEventListener("submit", async function(e){
    e.preventDefault();

    let formData = new FormData(this);

    const res = await fetch("/register", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    document.getElementById("msg").innerText = data.message || "Something went wrong";
});
</script>

</body>
</html>
